name: Build and Release

# PR build + smoke gate, and a GitHub Release on version tags - the
# series-standard CI shape, in npm form. Plain pushes to main no longer trigger
# CI (a merged PR was already tested). `npm install` compiles the CAS BACnet
# Stack from the (private) submodule source, so checkout needs a token that can
# read it, and the first run on a runner takes 10-20 minutes.

on:
  pull_request:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    name: Build + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: Visual Studio 2022 (v143), the toolset the stack's own
        # workflows build with. (Node 24.21's npm, node-gyp 12, also finds
        # Visual Studio 2026 on newer images.)
        os: [windows-2022, ubuntu-latest]
    steps:
      # The stack's MSVC intermediate paths mirror its source tree - without
      # long paths a deep runner workspace fails with "Cannot open source file".
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CAS_STACK_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          # The stack's Node package requires >=24.21.0 <25.
          node-version: 24.21

      # -frtti: node-gyp defaults to -fno-rtti, which breaks the Linux addon
      # build - same env the stack's own workflows use.
      - name: Install (compiles the CAS BACnet Stack addon)
        env:
          CXXFLAGS: -frtti
          CFLAGS: -frtti
          npm_config_cflags_cc: -frtti
          npm_config_cflags: -frtti
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Smoke test (device must come up and stay up)
        shell: bash
        run: |
          node dist/main.js --port 47821 < /dev/null > smoke.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 30); do
            grep -q "ready" smoke.log && break
            sleep 1
          done
          sleep 3
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "FAILED: process exited early"; cat smoke.log; exit 1
          fi
          grep -q "ready" smoke.log || { echo "FAILED: no ready banner"; cat smoke.log; exit 1; }
          kill $APP_PID
          echo "OK - device came up and stayed up"
          cat smoke.log

      - name: Wire Tests (Linux)
        if: runner.os == 'Linux'
        run: python3 tests/run_wire_tests.py --port 47821

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Source only. The CAS BACnet Stack binary (the addon `.node`, or any
      # `.dll` / `.so`) is never a release asset: users build it from the
      # submodule with `npm install`. Do not add `files:` here.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
